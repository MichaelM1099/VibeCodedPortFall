<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PORTFALL — Catch the connection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e20;color:#eef5ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:absolute;top:0;left:0;right:0;padding:28px 36px;display:flex;justify-content:space-between;pointer-events:none;gap:16px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:3px;color:#8fa5c9}.target{font-size:clamp(27px,5vw,44px);font-weight:850;letter-spacing:-1px;margin:4px 0}.sub{font-size:13px;color:#9fb1cc}.score{text-align:right;font-variant-numeric:tabular-nums}.score strong{font-size:44px;display:block;line-height:1.2}.hearts{color:#f8a8ae;letter-spacing:6px;margin-top:9px}#progress{position:absolute;top:0;height:3px;background:#a4ffd0;box-shadow:0 0 15px #a4ffd0;width:0;transition:width .3s}#pause{position:absolute;right:34px;bottom:24px;border:1px solid #ffffff30;background:#13213be0;color:#cbd7eb;border-radius:10px;padding:9px 14px;z-index:2}#status{position:absolute;left:24px;bottom:28px;font-size:12px;color:#b7d4c7;letter-spacing:1px;pointer-events:none}#toast{position:absolute;top:145px;left:50%;transform:translateX(-50%);text-align:center;color:#d6ffeb;font-size:14px;width:90%;pointer-events:none}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#060c1d75;backdrop-filter:blur(7px);padding:22px;z-index:3}#overlay.hidden{display:none}.card{max-width:490px;width:100%;padding:38px;border:1px solid #a5c9ff25;border-radius:25px;background:linear-gradient(145deg,#182743ef,#0b152bf5);box-shadow:0 30px 100px #0006}.mark{display:inline-block;width:34px;height:34px;background:#b7ffce;box-shadow:0 0 35px #91ffc05c;border-radius:7px;transform:rotate(-9deg);margin-bottom:23px}h1{font-size:clamp(36px,8vw,55px);letter-spacing:-3px;margin:0 0 7px}h2{font-size:34px;margin:0 0 12px;letter-spacing:-1px}.lead{color:#adbed8;line-height:1.6;margin:0 0 24px}.rules{display:grid;gap:12px;font-size:14px;color:#d3def0;margin-bottom:26px}.rules span{color:#acffd0;font-weight:700}kbd{background:#ffffff12;border:1px solid #ffffff23;padding:2px 7px;border-radius:5px;font:inherit}.primary{width:100%;background:#b6ffd1;color:#10251b;font-weight:800;border:0;border-radius:12px;padding:15px;box-shadow:0 5px 25px #78ffad12}.fine{font-size:11px;text-align:center;color:#8194b1;margin:16px 0 0;line-height:1.7}.touch{position:absolute;bottom:70px;left:20px;right:20px;display:none;justify-content:space-between;pointer-events:none}.touch button{pointer-events:auto;width:65px;height:55px;background:#152d4280;border:1px solid #c2ffe640;color:#dcfff0;border-radius:14px;font-size:24px;touch-action:none;user-select:none}@media(pointer:coarse){.touch{display:flex}}@media(max-width:550px){header{padding:23px 20px}.card{padding:27px}#status{font-size:10px;left:16px}#pause{right:16px}.sub{font-size:11px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Portfall game field"></canvas><div id="progress"></div>
<header><div><div class="eyebrow">CATCH THE PROTOCOL</div><div class="target" id="protocol">FTP</div><div class="sub" id="description">File Transfer Protocol · control</div></div><div class="score"><div class="eyebrow">SCORE <span id="best"></span></div><strong id="score">00</strong><div class="hearts" id="lives" aria-label="3 lives">♥ ♥ ♥</div></div></header>
<div id="toast" role="status" aria-live="polite"></div><div id="status">PORTFALL / NIGHT SHIFT</div><button id="pause" aria-label="Pause game">Ⅱ Pause</button>
<div class="touch"><button id="left" aria-label="Move left">←</button><button id="right" aria-label="Move right">→</button></div>
<div id="overlay"><div class="card" id="card"></div></div>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);
const protocols=[['FTP',21,'File Transfer Protocol · control'],['SSH',22,'Secure Shell'],['Telnet',23,'Remote terminal'],['SMTP',25,'Mail transfer'],['DNS',53,'Domain Name System'],['DHCP',67,'DHCP · server port'],['TFTP',69,'Trivial File Transfer Protocol'],['HTTP',80,'Web traffic'],['POP3',110,'Mail retrieval'],['NTP',123,'Network Time Protocol'],['IMAP',143,'Mail access'],['SNMP',161,'Network management'],['LDAP',389,'Directory access'],['HTTPS',443,'Secure web traffic'],['SMB',445,'File sharing'],['LDAPS',636,'LDAP over TLS'],['IMAPS',993,'IMAP over TLS'],['RDP',3389,'Remote Desktop Protocol']];
const odd=[['ARP','?','No transport port. Just neighbor gossip.'],['ICMP','?','No transport port. Ping has entered the chat.']];
const pool=[...protocols.map(p=>p[1]),8080];
let W,H,dpr,stars=[],grass=[],player={x:0,y:0,size:30},items=[],particles=[],keys=new Set(),score=0,lives=3,best=0,target=protocols[0],state='intro',elapsed=0,spawnClock=0,last=0,invulnerable=0,toastTime=0,round=0,shake=0;
try{best=Number(localStorage.getItem('portfall-best'))||0}catch(e){}
function resize(){let old=W||innerWidth;W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.x=Math.max(20,Math.min(W-20,(player.x||old/2)/old*W));player.y=H-105;stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*(H-90),r:Math.random()*1.4+.3,a:Math.random()*6}));grass=Array.from({length:Math.ceil(W/6)},(_,i)=>({x:i*6,h:5+Math.random()*16}));}addEventListener('resize',resize);resize();
function updateHUD(){$('#protocol').textContent=target[0];$('#description').textContent=target[2];$('#score').textContent=String(score).padStart(2,'0');$('#lives').textContent='♥ '.repeat(lives)+'♡ '.repeat(3-lives);$('#lives').setAttribute('aria-label',lives+' lives');$('#best').textContent=best?' / BEST '+best:'';$('#progress').style.width=Math.min(score/50*100,100)+'%';$('#status').textContent='PORTFALL / '+(score>=50?'ABSOLUTE PACKET CHAOS':score>=38?'NETWORK MELTDOWN':score>=25?'HEAVY TRAFFIC':score>=12?'PICKING UP SPEED':'NIGHT SHIFT');}
function message(t){$('#toast').textContent=t;toastTime=3;}
function nextTarget(){round++;target=round%5===0?odd[Math.floor(Math.random()*2)]:(()=>{const choices=protocols.filter(p=>p[0]!==target[0]);return choices[Math.floor(Math.random()*choices.length)]})();items=[];spawnClock=.45;updateHUD();if(target[1]==='?')message('Plot twist: no port. Catch the ?');}
function start(){score=0;lives=3;round=0;elapsed=0;items=[];particles=[];keys.clear();target=protocols[0];player.x=W/2;invulnerable=0;spawnClock=.2;state='playing';$('#overlay').classList.add('hidden');$('#pause').textContent='Ⅱ Pause';updateHUD();message('FTP control uses port 21. Catch it!');}
function finish(){state='over';if(score>best){best=score;try{localStorage.setItem('portfall-best',best)}catch(e){}}updateHUD();$('#card').innerHTML='<div class="eyebrow">CONNECTION CLOSED</div><h2 style="margin-top:15px">'+(score>=50?'You broke the network.':'End of transmission.')+'</h2><p class="lead">You caught <b style="color:#b6ffd1">'+score+'</b> correct ports. Best: '+best+'.<br>The last target was '+target[0]+' → '+target[1]+'.</p><button class="primary" id="restart">Reconnect ↗</button><p class="fine">Arrow keys to move · P to pause · Enter to retry</p>';$('#overlay').classList.remove('hidden');$('#restart').onclick=start;$('#restart').focus();}
function pause(){if(state==='playing'){state='paused';keys.clear();$('#card').innerHTML='<div class="mark"></div><h2>Traffic on hold.</h2><p class="lead">Take a breath. The packets can wait.</p><button class="primary" id="resume">Resume night shift ↗</button>';$('#overlay').classList.remove('hidden');$('#resume').onclick=pause;$('#resume').focus();$('#pause').textContent='▶ Resume';}else if(state==='paused'){state='playing';$('#overlay').classList.add('hidden');$('#pause').textContent='Ⅱ Pause';}}$('#pause').onclick=pause;
function burst(x,y,color){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.6,color});}
function damage(text,x,y){if(invulnerable>0)return;lives--;invulnerable=1;shake=.25;burst(x,y,'#ffa3b6');message(text);updateHUD();if(lives<=0)finish();}
function spawn(){const lanes=Math.max(3,Math.min(9,Math.floor(W/90))),spacing=W/lanes,correctLane=Math.floor(Math.random()*lanes);let count=Math.min(lanes-1,2+Math.floor(score/12.5));let others=Array.from({length:lanes},(_,i)=>i).filter(i=>i!==correctLane).sort(()=>Math.random()-.5).slice(0,count-1);for(const lane of [correctLane,...others]){let value=lane===correctLane?target[1]:pool.filter(n=>n!==target[1])[Math.floor(Math.random()*(pool.length-(pool.includes(target[1])?1:0)))];items.push({x:spacing*(lane+.5),y:160,value,correct:lane===correctLane,w:Math.max(48,String(value).length*12+20),h:38});}}
function tick(dt){elapsed+=dt;invulnerable=Math.max(0,invulnerable-dt);shake=Math.max(0,shake-dt);if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('#toast').textContent='';}let direction=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);player.x=Math.max(18,Math.min(W-18,player.x+direction*Math.max(460,W*.7)*dt));const speed=(H-265)*(.19+score*.0072+Math.pow(score/50,3)*1.25);spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=Math.max(.38,1.7-score*.022);}for(let i=items.length-1;i>=0;i--){let n=items[i];n.y+=speed*dt;if(Math.abs(n.x-player.x)<(n.w+player.size)/2&&Math.abs(n.y-player.y)<(n.h+player.size)/2){items.splice(i,1);if(n.correct){score++;burst(player.x,player.y,'#b6ffd1');message(target[0]+' → '+target[1]+' · Connected!');nextTarget();break;}else damage('Wrong port! '+target[0]+' uses '+target[1]+'.',n.x,n.y);}else if(n.y-n.h/2>player.y+player.size/2){items.splice(i,1);}if(state!=='playing')break;}}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function draw(dt,t){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#080e22');sky.addColorStop(.65,'#172440');sky.addColorStop(1,'#344755');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.35+.4*(Math.sin(t*.0007+s.a)+1)/2;ctx.fillStyle='#d5e7ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=55;ctx.shadowColor='#c9deef44';ctx.fillStyle='#d5e5ef';ctx.beginPath();ctx.arc(W*.76,Math.max(190,H*.23),22,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#152838';ctx.beginPath();ctx.moveTo(0,H-60);ctx.bezierCurveTo(W*.25,H-190,W*.48,H-30,W,H-140);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#183f37';ctx.beginPath();ctx.moveTo(0,H-60);ctx.quadraticCurveTo(W*.3,H-100,W*.6,H-65);ctx.quadraticCurveTo(W*.85,H-40,W,H-75);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#0e2d28';ctx.fillRect(0,H-48,W,48);ctx.strokeStyle='#4b80604d';for(const g of grass){ctx.beginPath();ctx.moveTo(g.x,H-45);ctx.lineTo(g.x+Math.sin(t*.001+g.x)*4,H-45-g.h);ctx.stroke();}ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);for(const n of items){ctx.strokeStyle='#b5d0ff55';ctx.fillStyle='#182b48';ctx.lineWidth=1;rounded(n.x-n.w/2,n.y-n.h/2,n.w,n.h,9);ctx.fill();ctx.stroke();ctx.fillStyle='#edf5ff';ctx.font='700 19px ui-monospace,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.value,n.x,n.y+1);ctx.strokeStyle='#c5dcff18';ctx.beginPath();ctx.moveTo(n.x,n.y-24);ctx.lineTo(n.x,n.y-45);ctx.stroke();}if(invulnerable<=0||Math.floor(t/80)%2===0){ctx.shadowBlur=25;ctx.shadowColor='#aaffc9aa';ctx.fillStyle='#b6ffd1';rounded(player.x-15,player.y-15,30,30,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#235b43';ctx.fillRect(player.x-7,player.y-4,4,4);ctx.fillRect(player.x+3,player.y-4,4,4);}for(let i=particles.length-1;i>=0;i--){let p=particles[i];if(state==='playing'){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);if(p.life<=0)particles.splice(i,1);}ctx.globalAlpha=1;ctx.restore();}
function frame(t){let dt=Math.min((t-last)/1000,.035);last=t;if(state==='playing')tick(dt);draw(dt,t);requestAnimationFrame(frame);}requestAnimationFrame(frame);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.repeat&&['p','P','Escape','Enter'].includes(e.key))return;if(e.key==='p'||e.key==='P'||e.key==='Escape')pause();if(e.key==='Enter'&&(state==='intro'||state==='over')){e.preventDefault();start();}keys.add(e.key);});addEventListener('keyup',e=>keys.delete(e.key));addEventListener('blur',()=>{keys.clear();if(state==='playing')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause();});
for(const [id,key]of [['left','ArrowLeft'],['right','ArrowRight']]){const b=$('#'+id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(key);};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(key);}
canvas.onpointerdown=canvas.onpointermove=e=>{if(state==='playing'&&e.buttons){player.x=Math.max(18,Math.min(W-18,e.clientX));}};
$('#card').innerHTML='<div class="mark"></div><div class="eyebrow">A LITTLE NETWORK NIGHTMARE</div><h1>PORTFALL<span style="color:#b6ffd1">.</span></h1><p class="lead">Catch the connection.<br>Try not to crash the network.</p><div class="rules"><div><kbd>←</kbd> <kbd>→</kbd> Move your little green square.</div><div><span>Catch</span> the port matching the protocol above.</div><div><span>Dodge</span> everything else. Three lives. No excuses.</div><div>Miss a correct port? No penalty. Catch the next one.</div></div><button class="primary" id="start">Start night shift ↗</button><p class="fine">P to pause · Touch arrows or drag on mobile<br>ARP & ICMP use no ports: catch ? instead.<br>At 50 points, the network chooses violence.</p>';
$('#start').onclick=start;updateHUD();
</script>
</body>
</html>
